<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Alat - PeachCamper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="../index.html">🏕️ PeachCamper</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="../index.html">Transaksi Sewa</a></li>
                    <li class="nav-item"><a class="nav-link active text-white fw-bold" href="list.html">Katalog Alat</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="../penyewa/list.html">Data Penyewa</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col text-center custom-header p-4 rounded shadow-sm">
                <h1 class="fw-bold">Katalog Alat Camping</h1>
                <p class="mb-0">Daftar perlengkapan yang tersedia untuk disewakan</p>
            </div>
        </div>

        <!-- Tombol Tambah Alat -->
        <div class="text-end mb-3">
            <button class="btn custom-btn" data-bs-toggle="modal" data-bs-target="#modalAlat">+ Tambah Alat</button>
        </div>

        <div class="row" id="alat-container"></div>
    </div>

    <!-- Modal Tambah Alat -->
    <div class="modal fade" id="modalAlat" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="border: 2px solid #ffb7b2;">
                <div class="modal-header custom-header">
                    <h5 class="modal-title fw-bold">Tambah Alat Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formAlat">
                    <div class="modal-body">
                        <div class="mb-3"><label class="form-label">Nama Alat</label><input type="text" class="form-control" id="inputNamaAlat" required></div>
                        <div class="mb-3"><label class="form-label">Merk</label><input type="text" class="form-control" id="inputMerk" required></div>
                        <div class="mb-3"><label class="form-label">Stok</label><input type="number" class="form-control" id="inputStok" required></div>
                        <div class="mb-3"><label class="form-label">Harga Sewa (Misal: Rp 50.000 / hari)</label><input type="text" class="form-control" id="inputHarga" required></div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn custom-btn w-100">Simpan Alat</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/alat.js"></script>
</body>
</html>
